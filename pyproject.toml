[project]
name = "quickstudy"
version = "0.1.0"
description = "自动化技术文档学习手册生成系统（M1：站点发现、全站爬取、结构化解析）"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "trafilatura>=1.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
render = [
    "playwright>=1.44",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]
# M2 预留：qdrant-client / networkx / dashscope 兼容客户端 / sentence-transformers
# M3 预留：docker SDK

[project.scripts]
quickstudy = "quickstudy.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["quickstudy*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
